<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>A320 MaintSys — Redirecting...</title>
  <script>
    // SPA redirect for GitHub Pages
    // Stores the path in sessionStorage and redirects to index.html
    sessionStorage.redirect = location.href;
    var pathSegmentsToKeep = 1; // /a320-maintsys/
    var loc = window.location;
    loc.replace(
      loc.protocol + '//' + loc.hostname + (loc.port ? ':' + loc.port : '') +
      loc.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/'
    );
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
